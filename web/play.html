<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東方紅魔郷 ~ the Embodiment of Scarlet Devil (Web)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #ccc;
    font-family: -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* The GL viewport renders 640x480. JS sizes the canvas to the largest 4:3 box
     that fits the window so it scales up uniformly with letterboxing. */
  #canvas {
    background: #000;
    display: block;
    image-rendering: pixelated;
    outline: none;
  }
  #status {
    position: absolute;
    top: 8px; left: 0; right: 0;
    text-align: center;
    font-size: 13px;
    color: #888;
    pointer-events: none;
  }
  #hint {
    position: absolute;
    bottom: 8px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: #555;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="status">Loading…</div>
  <canvas id="canvas" width="640" height="480" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="hint">方向键移动 · Z 射击 · X 炸弹 · Shift 低速 · Shift+Enter 切换全屏 · 点击画面后键盘生效</div>
</div>
<script>
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const canvas = document.getElementById('canvas');
  const wrap = document.getElementById('wrap');
  const ASPECT = 640 / 480;

  // Scale the canvas to the largest 4:3 box fitting the current viewport.
  function fitCanvas() {
    const W = wrap.clientWidth, H = wrap.clientHeight;
    let w = W, h = w / ASPECT;
    if (h > H) { h = H; w = h * ASPECT; }
    canvas.style.width = Math.round(w) + 'px';
    canvas.style.height = Math.round(h) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  // Low-latency rendering: force the WebGL context to be created with
  // `desynchronized: true`, which bypasses the browser's compositor queue and
  // sends frames closer to straight-to-display (the browser-equivalent of
  // disabling vsync to cut input lag). SDL creates the context inside wasm, so we
  // wrap getContext to inject the attribute before that first call.
  // preserveDrawingBuffer avoids flicker that desynchronized WebGL can otherwise show.
  (function patchGetContext() {
    const orig = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type, attrs) {
      if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
        attrs = Object.assign({}, attrs, { desynchronized: true, preserveDrawingBuffer: true });
      }
      return orig.call(this, type, attrs);
    };
  })();

  var Module = {
    canvas: canvas,
    print: (...args) => console.log(...args),
    printErr: (...args) => console.warn(...args),
    setStatus: (text) => {
      statusEl.textContent = text || '';
      if (!text) setTimeout(() => { statusEl.style.display = 'none'; }, 1500);
    },
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? `准备资源 (${this.totalDependencies - left}/${this.totalDependencies})` : '');
    },
    // The GL backend resizes the drawing buffer to 640x480; keep CSS fit after that.
    onRuntimeInitialized: () => setTimeout(fitCanvas, 0),
  };
  Module.setStatus('Downloading…');
  window.onerror = () => { Module.setStatus('运行出错，请看 Console'); };

  // Keep keyboard focus on the canvas so the game receives input.
  canvas.addEventListener('click', () => canvas.focus());
  window.addEventListener('load', () => canvas.focus());

  // Shift+Enter toggles browser fullscreen. Handle it here (capture phase) so it
  // doesn't reach the game as a keypress.
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      e.stopPropagation();
      if (!document.fullscreenElement) {
        wrap.requestFullscreen?.().then(fitCanvas).catch(() => {});
      } else {
        document.exitFullscreen?.().then(fitCanvas).catch(() => {});
      }
    }
  }, true);
  document.addEventListener('fullscreenchange', () => setTimeout(fitCanvas, 0));
</script>
<script async src="th06.js"></script>
</body>
</html>
