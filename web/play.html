<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東方紅魔郷 ~ the Embodiment of Scarlet Devil (Web)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #ccc;
    font-family: -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* The GL viewport renders 640x480. JS sizes the canvas to the largest 4:3 box
     that fits the window so it scales up uniformly with letterboxing. */
  #canvas {
    background: #000;
    display: block;
    image-rendering: pixelated;
    outline: none;
  }
  /* Loading screen: covers the black canvas until the game draws its first frame, so a slow
     download doesn't look like a broken page. */
  #loader {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #2a0508 0%, #000 70%);
    transition: opacity 0.5s;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  .ld-box {
    width: min(420px, calc(100vw - 32px));
    text-align: center;
  }
  .ld-title {
    font-size: 30px;
    letter-spacing: 0.12em;
    color: #f2d7d9;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
  }
  .ld-sub {
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #9a6a70;
  }
  .ld-bar {
    position: relative;
    margin: 28px 0 12px;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  #ld-fill {
    height: 100%;
    width: 0;
    border-radius: 3px;
    background: linear-gradient(90deg, #a3121f, #e8424f);
    transition: width 0.25s;
  }
  /* No measurable progress (engine start-up, first frame): a sliding band instead. */
  .ld-bar.busy #ld-fill {
    width: 30%;
    animation: ld-slide 1.2s ease-in-out infinite;
  }
  @keyframes ld-slide {
    from { transform: translateX(-100%); }
    to { transform: translateX(340%); }
  }
  #ld-step { font-size: 15px; color: #e6e6e6; }
  #ld-detail {
    margin-top: 6px;
    min-height: 1.4em;
    font-size: 12px;
    color: #999;
    font-variant-numeric: tabular-nums;
  }
  #ld-note { margin-top: 18px; font-size: 12px; color: #777; line-height: 1.6; }
  #loader.error #ld-step { color: #ff8a8a; }
  #ld-retry {
    margin-top: 16px;
    padding: 8px 22px;
    font: inherit;
    font-size: 14px;
    color: #fff;
    background: #a3121f;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  #hint {
    position: absolute;
    bottom: 8px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: #555;
    pointer-events: none;
  }

  /* 虚拟按键：仅在触摸设备显示。容器透传指针，只有控件本身接收触摸，
     这样手指不在按钮上时仍能看到/操作下方的游戏画面。 */
  #touch { display: none; }
  #touch.on { display: block; }
  #touch {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    touch-action: none;
  }
  #touch button,
  #tc-stick {
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 左下：方向摇杆，触点偏移映射到方向键（含斜向 = 同时两键）。 */
  #tc-stick {
    position: absolute;
    left: 5vw; bottom: 6vh;
    width: 38vw; max-width: 190px; aspect-ratio: 1;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.07);
    border: 2px solid rgba(255, 255, 255, 0.22);
    display: flex; align-items: center; justify-content: center;
  }
  #tc-knob {
    width: 42%; height: 42%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.34);
    pointer-events: none;
  }
  /* 右下：射击 / 炸弹 / 低速。右上：决定 / 菜单。flex 横排避免重叠。 */
  #tc-actions {
    position: absolute;
    right: 4vw; bottom: 6vh;
    display: flex; align-items: flex-end; gap: 14px;
    pointer-events: none;
  }
  #tc-sys {
    position: absolute;
    right: 4vw; top: 3vh;
    display: flex; gap: 12px;
    pointer-events: none;
  }
  #touch button {
    border-radius: 50%;
    color: #fff;
    font-family: inherit;
    font-weight: bold;
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.3);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    line-height: 1.1;
  }
  #touch button.pressed { background: rgba(255, 255, 255, 0.4); }
  #touch button small { font-size: 0.62em; font-weight: normal; opacity: 0.8; }
  .tc-act { width: 17vw; max-width: 84px; aspect-ratio: 1; font-size: 16px; }
  .tc-main { width: 21vw; max-width: 104px; font-size: 19px; }
  .tc-sm { width: 14vw; max-width: 64px; aspect-ratio: 1;
           font-size: 12px; background: rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>
<div id="wrap">
  <div id="loader">
    <div class="ld-box">
      <div class="ld-title">東方紅魔郷</div>
      <div class="ld-sub">the Embodiment of Scarlet Devil</div>
      <div class="ld-bar busy"><div id="ld-fill"></div></div>
      <div id="ld-step">正在连接…</div>
      <div id="ld-detail"></div>
      <div id="ld-note">首次打开需要下载游戏数据，网速慢时要等一会儿，页面没有卡住。</div>
      <button id="ld-retry" hidden onclick="location.reload()">重新加载</button>
    </div>
  </div>
  <canvas id="canvas" width="640" height="480" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="hint">方向键移动 · Z 射击 · X 炸弹 · Shift 低速 · Shift+Enter 切换全屏 · 点击画面后键盘生效</div>

  <!-- 虚拟按键：仅触摸设备显示（由脚本加 .on）。data-code 即派发的 KeyboardEvent.code。 -->
  <div id="touch">
    <div id="tc-stick"><div id="tc-knob"></div></div>
    <div id="tc-actions">
      <button class="tc-act" data-code="ShiftLeft">低速<small>Shift</small></button>
      <button class="tc-act tc-main" data-code="KeyX">炸弹<small>X</small></button>
      <button class="tc-act tc-main" data-code="KeyZ">射击<small>Z</small></button>
    </div>
    <div id="tc-sys">
      <button class="tc-sm" data-code="Escape">菜单<small>Esc</small></button>
      <button class="tc-sm" data-code="Enter">决定<small>↵</small></button>
    </div>
  </div>
</div>
<script>
  const hintEl = document.getElementById('hint');
  const canvas = document.getElementById('canvas');
  const wrap = document.getElementById('wrap');
  const ASPECT = 640 / 480;

  // Scale the canvas to the largest 4:3 box fitting the current viewport.
  function fitCanvas() {
    const W = wrap.clientWidth, H = wrap.clientHeight;
    let w = W, h = w / ASPECT;
    if (h > H) { h = H; w = h * ASPECT; }
    canvas.style.width = Math.round(w) + 'px';
    canvas.style.height = Math.round(h) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  // ---- Loading screen --------------------------------------------------------
  const loaderEl = document.getElementById('loader');
  const loader = {
    bar: loaderEl.querySelector('.ld-bar'),
    fill: document.getElementById('ld-fill'),
    step: document.getElementById('ld-step'),
    detail: document.getElementById('ld-detail'),
    note: document.getElementById('ld-note'),
    retry: document.getElementById('ld-retry'),
  };
  const mb = (bytes) => (bytes / 1048576).toFixed(1);
  // fraction in 0..1 fills the bar; null shows the sliding "busy" band.
  function showStep(text, fraction, detail) {
    if (loaderEl.classList.contains('error')) return;
    loader.step.textContent = text;
    loader.bar.classList.toggle('busy', fraction == null);
    loader.fill.style.width = fraction == null ? '' : (fraction * 100).toFixed(1) + '%';
    if (detail !== undefined) loader.detail.textContent = detail;
  }
  function showError(text) {
    showStep(text, 0, '');
    loaderEl.classList.add('error');
    loaderEl.classList.remove('gone');
    loader.note.textContent = '可能是网络中断。点下面的按钮重试，问题还在的话按 F12 看 Console 里的报错。';
    loader.retry.hidden = false;
  }
  function hideLoader() {
    loaderEl.classList.add('gone');
    setTimeout(() => { loaderEl.style.display = 'none'; }, 600);
  }

  // Low-latency rendering: force the WebGL context to be created with
  // `desynchronized: true`, which bypasses the browser's compositor queue and
  // sends frames closer to straight-to-display (the browser-equivalent of
  // disabling vsync to cut input lag). SDL creates the context inside wasm, so we
  // wrap getContext to inject the attribute before that first call.
  // preserveDrawingBuffer avoids flicker that desynchronized WebGL can otherwise show.
  //
  // We also use this hook to detect the first real frame: after assets finish
  // loading the game spends a noticeable chunk of time (slow devices especially)
  // decoding the DAT archives, compiling shaders and loading the title logo — all
  // before anything is drawn. Hiding the status text the instant assets are ready
  // (as monitorRunDependencies does) leaves a blank black screen during that gap.
  // Instead we keep the loading screen up until the first glDrawArrays call, which
  // is the game actually painting its first frame.
  let firstFrameSeen = false;
  function onFirstFrame() {
    if (firstFrameSeen) return;
    firstFrameSeen = true;
    hideLoader();
  }
  (function patchGetContext() {
    const orig = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type, attrs) {
      if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
        attrs = Object.assign({}, attrs, { desynchronized: true, preserveDrawingBuffer: true });
        const gl = orig.call(this, type, attrs);
        if (gl && !gl.__firstFrameHooked) {
          gl.__firstFrameHooked = true;
          const origDraw = gl.drawArrays;
          gl.drawArrays = function (...args) {
            onFirstFrame();
            return origDraw.apply(this, args);
          };
        }
        return gl;
      }
      return orig.call(this, type, attrs);
    };
  })();

  var Module = {
    canvas: canvas,
    print: (...args) => console.log(...args),
    printErr: (...args) => console.warn(...args),
    // The runtime's own status texts ("Running..." and so on) would overwrite the loading
    // screen's steps, so they only go to the console.
    setStatus: (text) => { if (text) console.log('[status]', text); },
    assetsLoaded: false,
    monitorRunDependencies: function (left) {
      // Once the assets are in, the game still has to finish downloading the engine, decode
      // the archives and build its first frame; onFirstFrame() hides the loading screen.
      if (!this.assetsLoaded) return;
      showStep(left ? '正在启动引擎…' : '正在初始化游戏…', null, '');
    },
    // Assets are NOT bundled (the combined .data would exceed the 20MB per-file
    // limit). Fetch each file listed in assets/manifest.js ({file, url, size} entries:
    // url is where it is served, file the name the game opens) and write it into MEMFS
    // before main() runs. addRunDependency blocks startup until all are loaded.
    preRun: [function () {
      addRunDependency('fetch-assets');
      (async () => {
        let timer = 0;
        try {
          if (typeof TH06_ASSETS === 'undefined') throw new Error('assets/manifest.js is missing');
          const files = TH06_ASSETS;
          const total = files.reduce((n, f) => n + f.size, 0);
          console.log('[assets] manifest has', files.length, 'files,', mb(total), 'MB');
          if (total) {
            loader.note.textContent =
              `首次打开需要下载约 ${Math.ceil(total / 1048576)} MB 游戏数据，网速慢时要等一会儿，页面没有卡住。`;
          }

          let loaded = 0, filesDone = 0;
          let lastLoaded = 0, lastTick = performance.now(), speed = 0;
          const update = () => {
            const fraction = total ? Math.min(loaded / total, 1) : filesDone / files.length;
            let detail = total ? `${mb(loaded)} / ${mb(total)} MB` : `${filesDone} / ${files.length}`;
            if (speed > 0) detail += ` · ${mb(speed)} MB/s`;
            showStep(`正在下载游戏数据 ${Math.floor(fraction * 100)}%`, fraction, detail);
          };
          timer = setInterval(() => {
            const now = performance.now();
            const recent = (loaded - lastLoaded) / ((now - lastTick) / 1000);
            speed = speed ? speed * 0.6 + recent * 0.4 : recent;
            lastLoaded = loaded;
            lastTick = now;
            update();
          }, 1000);
          update();

          // Reads one file, counting bytes as they arrive so the bar moves during the big
          // files too. Retries twice; a failed attempt takes its bytes back off the count.
          async function download(url) {
            for (let attempt = 1; ; attempt++) {
              let got = 0;
              try {
                const resp = await fetch('assets/' + url);
                if (!resp.ok) throw new Error('fetch ' + url + ' -> HTTP ' + resp.status);
                if (!resp.body) {
                  const buf = new Uint8Array(await resp.arrayBuffer());
                  loaded += buf.length;
                  return buf;
                }
                const reader = resp.body.getReader();
                const chunks = [];
                for (;;) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  chunks.push(value);
                  got += value.length;
                  loaded += value.length;
                  update();
                }
                const buf = new Uint8Array(got);
                let at = 0;
                for (const c of chunks) { buf.set(c, at); at += c.length; }
                return buf;
              } catch (e) {
                loaded -= got;
                if (attempt >= 3) throw e;
                console.warn('[assets] retrying', url, e);
                await new Promise(r => setTimeout(r, 1000 * attempt));
              }
            }
          }

          // A few downloads at once: faster than one after another on most connections.
          let next = 0;
          async function worker() {
            while (next < files.length) {
              const { file: rel, url } = files[next++];
              const buf = await download(url);
              const parts = rel.split('/');
              let dir = '';
              for (let i = 0; i < parts.length - 1; i++) {
                dir += parts[i];
                try { FS.mkdir('/' + dir); } catch (e) { /* exists */ }
                dir += '/';
              }
              FS.writeFile('/' + rel, buf);
              filesDone++;
            }
          }
          await Promise.all(Array.from({ length: 4 }, worker));
          clearInterval(timer);
          console.log('[assets] all', filesDone, 'files written to MEMFS');
          Module.assetsLoaded = true;
          showStep('正在启动引擎…', null, '');
          removeRunDependency('fetch-assets');
        } catch (e) {
          clearInterval(timer);
          console.error('[assets] load failed:', e);
          // The game can't run without its files, so it stays stopped here.
          showError('游戏数据下载失败');
        }
      })();
    }],
    // The GL backend resizes the drawing buffer to 640x480; keep CSS fit after that.
    onRuntimeInitialized: () => setTimeout(fitCanvas, 0),
  };
  // Before the first frame an error means the game won't start; afterwards it stays in the
  // console rather than covering the game.
  window.onerror = () => { if (!firstFrameSeen) showError('游戏启动出错'); };

  // Keep keyboard focus on the canvas so the game receives input.
  canvas.addEventListener('click', () => canvas.focus());
  window.addEventListener('load', () => canvas.focus());

  // Shift+Enter toggles browser fullscreen. Handle it here (capture phase) so it
  // doesn't reach the game as a keypress.
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      e.stopPropagation();
      if (!document.fullscreenElement) {
        wrap.requestFullscreen?.().then(fitCanvas).catch(() => {});
      } else {
        document.exitFullscreen?.().then(fitCanvas).catch(() => {});
      }
    }
  }, true);
  document.addEventListener('fullscreenchange', () => setTimeout(fitCanvas, 0));

  // ---- 虚拟按键（移动端）----------------------------------------------------
  // emscripten 的 SDL2 在 window 上监听 keydown/keyup，且只读事件的 `code`
  // 字段映射成 SDL scancode（见 SDL_emscriptenevents.c）。所以这里合成带正确
  // `code` 的 KeyboardEvent 派发到 window，游戏侧的 SDL_GetKeyboardState 完全
  // 无法区分真假按键 —— 无需改动 C++ 或重新编译。
  (function setupTouchControls() {
    const touch = document.getElementById('touch');

    // 触摸设备才显示虚拟按键。监听 matchMedia 的 change 而非加载时一次性判断：
    // DevTools 切换设备模式、平板旋转等动态变化都能即时响应（真机首次加载也会
    // 立即命中）。事件监听始终绑定，仅用 .on 控制显隐，对桌面端无副作用。
    const mq = matchMedia('(pointer: coarse)');
    function updateVisibility() {
      const isTouch = mq.matches || 'ontouchstart' in window;
      touch.classList.toggle('on', isTouch);
      setTimeout(fitCanvas, 0);
    }
    mq.addEventListener('change', updateVisibility);
    updateVisibility();

    // 同一个 code 可能被多个触点同时驱动（如摇杆 + 按钮），用计数避免一个
    // 触点抬起就误放另一个还按着的键。仅在 0↔1 跳变时才真正派发事件。
    const held = new Map();
    function press(code) {
      const n = (held.get(code) || 0) + 1;
      held.set(code, n);
      if (n === 1) {
        window.dispatchEvent(new KeyboardEvent('keydown', { code, bubbles: true }));
      }
    }
    function release(code) {
      const n = (held.get(code) || 0) - 1;
      if (n <= 0) {
        held.delete(code);
        window.dispatchEvent(new KeyboardEvent('keyup', { code, bubbles: true }));
      } else {
        held.set(code, n);
      }
    }

    // 动作 / 系统按钮：按住=keydown，松开/移出=keyup。
    for (const btn of touch.querySelectorAll('button[data-code]')) {
      const code = btn.dataset.code;
      let active = false;
      const down = (e) => {
        e.preventDefault();
        if (active) return;
        active = true;
        btn.classList.add('pressed');
        press(code);
      };
      const up = (e) => {
        e.preventDefault();
        if (!active) return;
        active = false;
        btn.classList.remove('pressed');
        release(code);
      };
      btn.addEventListener('pointerdown', down);
      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointercancel', up);
      btn.addEventListener('pointerleave', up);
    }

    // 摇杆：触点相对圆心的偏移 → 八方向。死区避免轻触误触发；超过阈值的轴
    // 才置位，斜向时两轴同时按下（游戏用方向键组合实现斜向移动）。
    const stick = document.getElementById('tc-stick');
    const knob = document.getElementById('tc-knob');
    const DIRS = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
    let dirState = { up: false, down: false, left: false, right: false };
    let stickPointer = null;

    function applyDir(next) {
      for (const k in DIRS) {
        if (next[k] && !dirState[k]) press(DIRS[k]);
        else if (!next[k] && dirState[k]) release(DIRS[k]);
      }
      dirState = next;
    }
    function clearDir() {
      applyDir({ up: false, down: false, left: false, right: false });
      knob.style.transform = '';
    }
    function updateStick(e) {
      const r = stick.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dx = e.clientX - cx, dy = e.clientY - cy;
      const radius = r.width / 2;
      const dead = radius * 0.28;
      const next = { up: false, down: false, left: false, right: false };
      if (Math.abs(dx) > dead) next[dx < 0 ? 'left' : 'right'] = true;
      if (Math.abs(dy) > dead) next[dy < 0 ? 'up' : 'down'] = true;
      applyDir(next);
      // 旋钮跟随，限制在圆内，给操作反馈。
      const dist = Math.min(Math.hypot(dx, dy), radius);
      const ang = Math.atan2(dy, dx);
      knob.style.transform = `translate(${Math.cos(ang) * dist * 0.5}px, ${Math.sin(ang) * dist * 0.5}px)`;
    }
    stick.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      stickPointer = e.pointerId;
      stick.setPointerCapture(e.pointerId);
      updateStick(e);
    });
    stick.addEventListener('pointermove', (e) => {
      if (e.pointerId !== stickPointer) return;
      e.preventDefault();
      updateStick(e);
    });
    const stickEnd = (e) => {
      if (e.pointerId !== stickPointer) return;
      e.preventDefault();
      stickPointer = null;
      clearDir();
    };
    stick.addEventListener('pointerup', stickEnd);
    stick.addEventListener('pointercancel', stickEnd);
  })();
</script>
<script src="assets/manifest.js" charset="utf-8"></script>
<script async src="th06.js"></script>
</body>
</html>
